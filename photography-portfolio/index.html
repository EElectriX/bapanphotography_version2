    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Bapan Mondal Photography Academy",
      "url": "https://www.bapanphotography.in/",
      "description": "Learn professional photography with Bapan Mondal — portrait, editorial & documentary photography courses, workshops, and bookings.",
      "founder": { "@type": "Person", "name": "Bapan Mondal" },
      "image": "https://www.bapanphotography.in/bapan_logo.jpg"
    }
    </script>
    <script type="text/javascript">
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    })(window.location);
  </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
